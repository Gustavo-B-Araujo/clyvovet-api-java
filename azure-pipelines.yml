trigger:
  branches:
    include:
      - master

pool:
  vmImage: ubuntu-latest

variables:
  azureSubscription: azure-clyvo
  webAppName: app-clyvo-api

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: BuildJar
        displayName: Gerar JAR
        steps:
          - task: JavaToolInstaller@0
            displayName: Java 21
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - script: |
              chmod +x gradlew
              ./gradlew test --no-daemon
            displayName: Executar testes

          - task: PublishTestResults@2
            displayName: Publicar resultados dos testes
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: build/test-results/test/*.xml
              testRunTitle: Testes unitários

          - script: ./gradlew bootJar --no-daemon
            displayName: Build com Gradle

          - task: CopyFiles@2
            displayName: Copiar JAR
            inputs:
              SourceFolder: build/libs
              Contents: '*.jar'
              TargetFolder: $(Build.ArtifactStagingDirectory)

          - publish: $(Build.ArtifactStagingDirectory)
            artifact: drop
            displayName: Publicar artefato

  - stage: Deploy
    displayName: Deploy
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployWebApp
        displayName: Deploy no App Service
        steps:
          - download: current
            artifact: drop
            displayName: Baixar artefato

          - task: AzureAppServiceSettings@1
            displayName: Configurar variáveis protegidas
            inputs:
              azureSubscription: $(azureSubscription)
              appName: $(webAppName)
              resourceGroupName: ch-clyvo
              appSettings: |
                [
                  { "name": "SPRING_DATASOURCE_URL", "value": "$(DB_URL)", "slotSetting": false },
                  { "name": "SPRING_DATASOURCE_USERNAME", "value": "$(DB_USER)", "slotSetting": false },
                  { "name": "SPRING_DATASOURCE_PASSWORD", "value": "$(DB_PASSWORD)", "slotSetting": false },
                  { "name": "JWT_SECRET", "value": "$(JWT_SECRET)", "slotSetting": false },
                  { "name": "WEBSITES_PORT", "value": "8080", "slotSetting": false }
                ]

          - task: AzureWebApp@1
            displayName: Deploy do JAR
            inputs:
              azureSubscription: $(azureSubscription)
              appType: webAppLinux
              appName: $(webAppName)
              package: $(Pipeline.Workspace)/drop/*.jar
              runtimeStack: JAVA|21-java21
