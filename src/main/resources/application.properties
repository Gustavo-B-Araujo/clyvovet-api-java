# Em produção (Azure) estes valores vêm de variáveis de ambiente:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD e JWT_SECRET.
# Para rodar localmente, crie src/main/resources/application-local.properties (já no .gitignore) com:
#   spring.datasource.url=...
#   spring.datasource.username=...
#   spring.datasource.password=...
#   jwt.secret=...

spring.application.name=clyvovet
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.config.import=optional:classpath:application-local.properties


spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.cache.type=simple
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method

logging.level.br.com.fiap.clyvovet=DEBUG

jwt.expiration-ms=86400000
